<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Pixel Arthur — Portfolio under construction." />
  <title>Pixel Arthur — Under Construction</title>

  <style>
    @font-face {
      font-family: 'Blach';
      src: url('./BLACH___.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg: #000000;
      --panel: #1b1025;
      --border: #331f47;
      --text: #f4eaff;
      --accent: #ffdc00;
      --muted: #c7b8da;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .panel {
      width: 100%;
      max-width: 760px;
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 40px 24px 28px;
      text-align: center;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4);
    }

    h1,
    h2 {
      font-family: 'Blach', Arial, sans-serif;
      margin: 0;
      line-height: 1;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(2.5rem, 7vw, 4.6rem);
      color: var(--text);
      letter-spacing: 0.04em;
      margin-bottom: 12px;
    }

    h2 {
      font-size: clamp(1.1rem, 3.2vw, 1.8rem);
      color: var(--accent);
      letter-spacing: 0.12em;
      margin-bottom: 28px;
    }

    .monster-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 26px;
    }

    .monster-wrap img {
      width: 256px;   /* 64 x 4 */
      height: 256px;  /* 64 x 4 */
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .contact {
      margin: 0 0 28px;
      font-size: 1.05rem;
      color: var(--muted);
    }

    .contact a {
      color: var(--accent);
      text-decoration: none;
      font-weight: bold;
    }

    .contact a:hover,
    .contact a:focus-visible {
      text-decoration: underline;
    }

    footer {
      border-top: 1px solid var(--border);
      padding-top: 18px;
      font-size: 0.78rem;
      line-height: 1.55;
      color: #9b8cad;
    }

    footer p {
      margin: 0 0 8px;
    }

    footer p:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Pixel Arthur</h1>
    <h2>Under Construction</h2>

    <div class="monster-wrap">
      <img src="./monster.png" alt="Construction monster mascot" />
    </div>

    <p class="contact">
      Contact:
      <a href="mailto:contact@pixelarthur.art">contact@pixelarthur.art</a>
    </p>

    <footer>
      <p>© 2026 Pixel Arthur. All rights reserved.</p>
      <p>All artwork, characters and visual material on this site are property of Pixel Arthur unless otherwise stated.</p>
      <p>This website is currently under construction.</p>
    </footer>
  </main>
</body>
</html>
