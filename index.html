
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Pixel Arthur — Pixel Art & Game Development. Portfolio under construction.">
  <title>Pixel Arthur — Under Construction</title>

  <style>
    @font-face {
      font-family: 'Blach';
      src: url('./BLACH___.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #000000;
      --panel: #1b1025;
      --border: #331f47;
      --text: #f4eaff;
      --accent: #ffdc00;
      --muted: #c7b8da;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background-color: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 24px 24px 0;

      display: flex;
      flex-direction: column;
      align-items: center;

      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;

      /* Mosaico de Manuela y Yellowfinger */
      background-color: var(--bg);
      background-image: url('./pixelarthur_mosaic.png');
      background-repeat: repeat;
      background-position: center top;
      background-size: 448px 448px;
    }

    .panel {
      width: 100%;
      max-width: 760px;
      flex-shrink: 0;
      margin: auto 0;

      background-color: var(--panel);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 36px 24px 28px;
      text-align: center;
    }

    h1 {
      margin: 0;
    }

    /* Logo original: 512 x 256 */
    .logo {
      display: block;
      width: 512px;
      height: auto;
      max-width: 100%;
      margin: 0 auto 12px;
      image-rendering: pixelated;
    }

    h2 {
      font-family: 'Blach', Arial, sans-serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: normal;
      line-height: 1.2;
      letter-spacing: 0;
      text-transform: none;
      color: var(--accent);
      margin: 0 0 24px;
    }

    /* Monstruo original: 64 x 64 */
    .monster {
      display: block;
      width: 128px;
      height: 128px;
      margin: 0 auto 26px;
      image-rendering: pixelated;
    }

    .contact {
      margin: 0 0 28px;
      font-size: 1.05rem;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .contact a {
      color: var(--accent);
      text-decoration: none;
      font-weight: bold;
    }

    .contact a:hover,
    .contact a:focus-visible {
      text-decoration: underline;
    }

    footer {
      border-top: 1px solid var(--border);
      padding-top: 18px;
      font-size: 0.78rem;
      line-height: 1.55;
      color: #c7b8da;
    }

    footer p {
      margin: 0 0 8px;
    }

    /* Franja de cuadros inferior */
    .checker-strip {
      width: calc(100% + 48px);
      height: 32px;
      flex: 0 0 32px;
      margin-top: 24px;

      background-image: url('./checker_band.png');
      background-repeat: repeat-x;
      background-position: left bottom;
      background-size: 224px 32px;
      image-rendering: pixelated;
    }

    /* Adaptación para móviles */
    @media (max-width: 640px) {
      .panel {
        padding: 24px 16px;
      }

      .logo {
        width: 256px;
      }

      .monster {
        width: 128px;
        height: 128px;
      }
    }
  </style>
</head>

<body>
  <main class="panel">

    <h1>
      <img
        class="logo"
        src="./pixel_arthur_logo_2.png"
        alt="Pixel Arthur">
    </h1>

    <h2>Under Construction</h2>

    <img
      class="monster"
      src="./monster.png"
      alt="Construction monster mascot">

    <p class="contact">
      Contact:
      <a href="mailto:contact@pixelarthur.art">
        contact@pixelarthur.art
      </a>
    </p>

    <footer>
      <p>© 2026 Pixel Arthur. All rights reserved.</p>
      <p>
        All artwork, characters and visual material on this
        site are property of Pixel Arthur unless otherwise stated.
      </p>
    </footer>

  </main>

  <div class="checker-strip" aria-hidden="true"></div>
</body>
</html>
