<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Arthur — Under Construction</title>
  <meta name="description" content="Pixel Arthur portfolio website. Currently under construction." />
  <style>
    :root {
      --bg: #1b1025;
      --panel: #1a1a1a;
      --text: #f2f2f2;
      --muted: #b8b8b8;
      --accent: #9ed86d;
      --border: #2a2a2a;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 40px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 5vw, 3.5rem);
      letter-spacing: 0.08em;
    }

    .subtitle {
      margin: 0 0 30px;
      color: var(--muted);
      font-size: 1.1rem;
    }

    .monster-wrapper {
      margin: 0 auto 28px;
      display: flex;
      justify-content: center;
    }

    .monster-wrapper img {
      max-width: 100%;
      width: 320px;
      height: auto;
      image-rendering: auto;
    }

    .contact {
      font-size: 1.05rem;
      margin: 0 0 28px;
      color: var(--text);
    }

    .contact a {
      color: var(--accent);
      text-decoration: none;
      font-weight: bold;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    footer {
      border-top: 1px solid var(--border);
      padding-top: 18px;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.5;
    }

    .small-note {
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>PIXEL ARTHUR</h1>
    <p class="subtitle">Portfolio under construction</p>

    <div class="monster-wrapper">
      <img src="monster.png" alt="Construction monster mascot for Pixel Arthur" />
    </div>

    <p class="contact">
      Contact:
      <a href="mailto:contact@pixelarthur.art">contact@pixelarthur.art</a>
    </p>

    <footer>
      <div>© 2026 Pixel Arthur. All rights reserved.</div>
      <div class="small-note">
        All artwork, characters and visual material on this site are property of Pixel Arthur unless otherwise stated.
      </div>
      <div class="small-note">
        This website is currently under construction.
      </div>
    </footer>
  </main>
</body>
</html>m
